name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check
      - run: npm run test:rules
      - run: npm audit --omit=dev --omit=optional --audit-level=high
      # Report CLI tooling advisories and block critical findings while upstream
      # resolves the remaining high/moderate transitive dependency advisories.
      - name: Audit all CLI tooling dependencies
        run: npm audit --audit-level=critical
      - name: Audit all Functions dependencies
        run: npm audit --prefix functions --audit-level=high
